<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQ | Payment Status</title>
  <link rel="stylesheet" href="css/payment.css">
  <link rel="stylesheet" href="css/navigation.css">
  <script src="js/msp.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">A</span><span>AgriQ</span></a>
    <button class="nav-toggle" aria-expanded="false" data-i18n="nav_menu">Menu</button>
    <nav class="primary-nav" aria-label="Farmer navigation">
      <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="booking.html" data-i18n="nav_book_slot">Book Slot</a>
      <a href="procurement.html" data-i18n="nav_procurement">Procurement</a>
      <a href="payment.html" aria-current="page" data-i18n="nav_payment_status">Payment Status</a>
      <a href="my-profile.html" data-i18n="nav_my_profile">My Profile</a>
      <select class="lang-select" aria-label="Select Language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
      </select>
      <button id="logout" class="nav-logout" data-i18n="nav_logout">Logout</button>
    </nav>
  </header>

  <main class="payment-page">
    <section class="page-heading">
      <p class="eyebrow" data-i18n="farmer_services_portal">Farmer services portal</p>
      <h1 data-i18n="pay_title">Payment status</h1>
      <p data-i18n="pay_subtitle">Track your procurement payment records and their current status.</p>
    </section>

    <section class="payment-layout">
      <section class="card form-card" aria-labelledby="form-heading">
        <h2 id="form-heading" data-i18n="pay_form_heading">Record payment status</h2>
        <form id="paymentForm">
          <label for="cropName" data-i18n="proc_crop_label">Crop Name</label>
          <select id="cropName" required>
            <option value="" data-i18n="proc_select_crop">Select a crop</option>
          </select>

          <label for="amount" data-i18n="pay_amount_label">Amount (₹)</label>
          <input id="amount" type="number" min="1" step="0.01" placeholder="e.g. 15000" required>

          <div class="form-row">
            <div>
              <label for="paymentDate" data-i18n="pay_date_label">Payment Date</label>
              <input id="paymentDate" type="date" required>
            </div>
            <div>
              <label for="paymentStatus" data-i18n="pay_status_label">Payment Status</label>
              <select id="paymentStatus" required>
                <option value="PENDING" data-i18n="pay_opt_pending">Pending</option>
                <option value="PROCESSING" data-i18n="pay_opt_processing">Processing</option>
                <option value="PAID" data-i18n="pay_opt_paid">Paid</option>
              </select>
            </div>
          </div>

          <button class="primary-button" type="submit" data-i18n="pay_submit_btn">Record Payment</button>
        </form>
        <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
      </section>

      <section class="card records-card" aria-labelledby="records-heading">
        <div class="section-title">
          <div>
            <p class="eyebrow" data-i18n="proc_records_eyebrow">Your records</p>
            <h2 id="records-heading" data-i18n="pay_history_heading">Payment History</h2>
          </div>
          <button id="refreshPayments" class="text-button" type="button" data-i18n="btn_refresh">Refresh</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th data-i18n="th_crop">Crop</th>
                <th data-i18n="th_amount">Amount</th>
                <th data-i18n="th_date">Date</th>
                <th data-i18n="th_status">Status</th>
              </tr>
            </thead>
            <tbody id="paymentRows">
              <tr><td colspan="4" class="empty-state" data-i18n="pay_loading">Loading payment records...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    let farmer;
    try { farmer = JSON.parse(sessionStorage.getItem('farmer')); } catch (error) { farmer = null; }
    const farmerId = farmer && farmer.id;
    if (!farmerId) window.location.replace(sessionStorage.getItem('admin') === 'true' ? 'admin-dashboard.html' : 'index.html');

    document.querySelector('.nav-toggle').addEventListener('click', e => {
      const nav = document.querySelector('.primary-nav');
      nav.classList.toggle('is-open');
      e.currentTarget.setAttribute('aria-expanded', nav.classList.contains('is-open'));
    });

    document.getElementById('logout').addEventListener('click', () => {
      sessionStorage.removeItem('farmer');
      window.location.href = 'index.html';
    });

    const form = document.getElementById('paymentForm');
    const cropSelect = document.getElementById('cropName');
    const formMessage = document.getElementById('formMessage');
    const rows = document.getElementById('paymentRows');
    let cachedPayments = [];

    function populateCrops() {
      const currentVal = cropSelect.value;
      cropSelect.innerHTML = `<option value="">${AgriQI18n.t('proc_select_crop')}</option>`;
      Object.keys(AgriQMSP.rates).forEach(crop => {
        const option = document.createElement('option');
        option.value = crop;
        option.textContent = AgriQI18n.crop(crop);
        if (crop === currentVal) option.selected = true;
        cropSelect.appendChild(option);
      });
    }

    populateCrops();
    document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];

    function formatDate(date) {
      if (!date) return '—';
      const lang = AgriQI18n.getLanguage();
      const locale = lang === 'hi' ? 'hi-IN' : (lang === 'mr' ? 'mr-IN' : 'en-IN');
      return new Date(`${date}T00:00:00`).toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function addCell(row, value) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.appendChild(cell);
    }

    function paymentRow(payment) {
      const row = document.createElement('tr');
      addCell(row, AgriQI18n.crop(payment.cropName));
      addCell(row, `₹${Number(payment.amount).toFixed(2)}`);
      addCell(row, formatDate(payment.paymentDate));

      const statusCell = document.createElement('td');
      const status = document.createElement('span');
      const rawStatus = (payment.paymentStatus || 'PENDING').toLowerCase();
      status.className = `status status-${rawStatus}`;
      status.textContent = AgriQI18n.t('pay_opt_' + rawStatus) || payment.paymentStatus;
      statusCell.appendChild(status);
      row.appendChild(statusCell);

      return row;
    }

    function renderPayments(payments) {
      cachedPayments = payments || [];
      rows.innerHTML = '';
      if (!cachedPayments.length) {
        rows.innerHTML = `<tr><td colspan="4" class="empty-state">${AgriQI18n.t('pay_empty')}</td></tr>`;
        return;
      }
      cachedPayments.forEach((payment) => rows.appendChild(paymentRow(payment)));
    }

    async function loadPayments() {
      if (!farmerId) return;
      rows.innerHTML = `<tr><td colspan="4" class="empty-state">${AgriQI18n.t('pay_loading')}</td></tr>`;
      try {
        const response = await fetch(`/api/payments/farmer/${farmerId}`);
        if (!response.ok) throw new Error();
        const payments = await response.json();
        renderPayments(payments);
      } catch (error) {
        rows.innerHTML = `<tr><td colspan="4" class="empty-state error-state">${AgriQI18n.t('pay_error')}</td></tr>`;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      formMessage.textContent = '';
      const payment = {
        farmerId,
        cropName: cropSelect.value,
        amount: Number(document.getElementById('amount').value),
        paymentDate: document.getElementById('paymentDate').value,
        paymentStatus: document.getElementById('paymentStatus').value
      };
      try {
        const response = await fetch('/api/payments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payment)
        });
        if (!response.ok) throw new Error();
        formMessage.textContent = AgriQI18n.t('pay_success');
        form.reset();
        document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('paymentStatus').value = 'PENDING';
        await loadPayments();
      } catch (error) {
        formMessage.textContent = AgriQI18n.t('pay_error');
      }
    });

    document.getElementById('refreshPayments').addEventListener('click', loadPayments);
    loadPayments();

    window.addEventListener('agriq-lang-change', () => {
      populateCrops();
      if (cachedPayments.length) {
        renderPayments(cachedPayments);
      }
    });
  </script>
</body>
</html>
