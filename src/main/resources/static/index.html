<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQ | Farmer Login</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">A</span><span>AgriQ</span></a></header>
  <main class="auth-card">
    <p class="eyebrow">Farmer services portal</p>
    <h1>Farmer Login</h1>
    <form id="login-form">
      <label for="mobileNumber">Mobile Number</label>
      <input id="mobileNumber" type="tel" inputmode="numeric" required>
      <label for="pin">4-digit PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required>
      <button type="submit">Login</button>
    </form>
    <p id="message" class="message" role="alert"></p>
    <p class="link">New Farmer? <a href="register.html">Register here</a></p>
    <p class="link"><a href="admin-login.html">Admin login</a></p>
  </main>
  <script>
    if (sessionStorage.getItem('admin') === 'true') window.location.replace('admin-dashboard.html');
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      try {
        const response = await fetch('/api/farmers/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobileNumber: form.mobileNumber.value.trim(), pin: form.pin.value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) { message.textContent = data.message || 'Login failed. Please check your details.'; return; }
        sessionStorage.setItem('farmer', JSON.stringify(data));
        window.location.href = 'dashboard.html';
      } catch (error) {
        message.textContent = 'Unable to connect. Please try again.';
      }
    });
  </script>
</body>
</html>
