<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQ | Book Slot</title>
  <link rel="stylesheet" href="css/booking.css">
  <link rel="stylesheet" href="css/navigation.css">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="dashboard.html"><span class="brand-mark" aria-hidden="true">A</span><span>AgriQ</span></a>
    <button class="nav-toggle" aria-expanded="false" data-i18n="nav_menu">Menu</button>
    <nav class="primary-nav" aria-label="Farmer navigation">
      <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="booking.html" aria-current="page" data-i18n="nav_book_slot">Book Slot</a>
      <a href="procurement.html" data-i18n="nav_procurement">Procurement</a>
      <a href="payment.html" data-i18n="nav_payment_status">Payment Status</a>
      <a href="my-profile.html" data-i18n="nav_my_profile">My Profile</a>
      <select class="lang-select" aria-label="Select Language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
      </select>
      <button id="logout" class="nav-logout" data-i18n="nav_logout">Logout</button>
    </nav>
  </header>

  <main class="booking-page">
    <section class="page-heading">
      <p class="eyebrow" data-i18n="farmer_services_portal">Farmer services portal</p>
      <h1 data-i18n="booking_title">Book a procurement slot</h1>
      <p data-i18n="booking_subtitle">Schedule a convenient mandi visit and track your appointment history.</p>
    </section>

    <div class="booking-grid">
      <!-- Left Column: Slot Booking Form -->
      <section class="card form-card" aria-labelledby="form-heading">
        <h2 id="form-heading" data-i18n="booking_form_heading">Slot details</h2>
        <form id="bookingForm">
          <label for="centreId" data-i18n="booking_centre_label">Procurement Centre</label>
          <select id="centreId" required>
            <option value="" data-i18n="booking_loading_centres">Loading centres...</option>
          </select>

          <div id="locationCard" class="location-card" hidden>
            <span class="location-label" data-i18n="booking_location_label">Centre location</span>
            <strong id="centreLocation"></strong>
          </div>

          <label for="bookingDate" data-i18n="booking_date_label">Booking Date</label>
          <input id="bookingDate" type="date" required>

          <label for="timeSlot" data-i18n="booking_time_label">Time Slot</label>
          <select id="timeSlot" required>
            <option value="" data-i18n="booking_select_time">Select a time slot</option>
            <option>09:00 AM - 10:00 AM</option>
            <option>10:00 AM - 11:00 AM</option>
            <option>11:00 AM - 12:00 PM</option>
            <option>02:00 PM - 03:00 PM</option>
            <option>03:00 PM - 04:00 PM</option>
          </select>

          <button class="primary-button" type="submit" data-i18n="booking_submit_btn">Book Slot</button>
        </form>
        <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
        <div id="successMessage" class="success-message" hidden role="status">
          <strong data-i18n="booking_success_title">Slot booked successfully</strong>
          <span id="successDetails"></span>
          <span id="successToken"></span>
          <span id="successQueueStatus"></span>
        </div>
      </section>

      <!-- Right Column: My Bookings / Your Visits -->
      <section id="my-bookings" class="card bookings-card" aria-labelledby="bookings-heading">
        <div class="section-title">
          <div>
            <p class="eyebrow" data-i18n="booking_visits_eyebrow">Your visits</p>
            <h2 id="bookings-heading" data-i18n="booking_visits_heading">My Bookings</h2>
          </div>
          <button id="refreshBookings" class="text-button" type="button" data-i18n="btn_refresh">Refresh</button>
        </div>
        <div id="bookingsList" class="bookings-list" aria-live="polite">
          <p class="empty-state" data-i18n="booking_loading">Loading your bookings...</p>
        </div>
      </section>
    </div>
  </main>

  <script>
    let farmer;
    try { farmer = JSON.parse(sessionStorage.getItem('farmer')); } catch (error) { farmer = null; }
    const farmerId = farmer && farmer.id;
    if (!farmerId) {
      window.location.replace(sessionStorage.getItem('admin') === 'true' ? 'admin-dashboard.html' : 'index.html');
    }

    document.querySelector('.nav-toggle').addEventListener('click', e => {
      const nav = document.querySelector('.primary-nav');
      nav.classList.toggle('is-open');
      e.currentTarget.setAttribute('aria-expanded', nav.classList.contains('is-open'));
    });

    document.getElementById('logout').addEventListener('click', () => {
      sessionStorage.removeItem('farmer');
      window.location.href = 'index.html';
    });

    const centreSelect = document.getElementById('centreId');
    const locationCard = document.getElementById('locationCard');
    const centreLocation = document.getElementById('centreLocation');
    const formMessage = document.getElementById('formMessage');
    const bookingsList = document.getElementById('bookingsList');
    let centres = [];
    let cachedBookings = [];

    document.getElementById('bookingDate').min = new Date().toISOString().split('T')[0];

    async function loadCentres() {
      try {
        const response = await fetch('/api/bookings/centres');
        if (!response.ok) throw new Error();
        centres = await response.json();
        renderCentreOptions();
      } catch (error) {
        centreSelect.innerHTML = `<option value="">${AgriQI18n.t('booking_unable_load_centres')}</option>`;
        formMessage.textContent = AgriQI18n.t('booking_unable_load_centres');
      }
    }

    function renderCentreOptions() {
      const currentVal = centreSelect.value;
      centreSelect.innerHTML = `<option value="">${AgriQI18n.t('booking_select_centre')}</option>`;
      centres.forEach((centre) => {
        const option = document.createElement('option');
        option.value = centre.id;
        option.textContent = centre.name;
        if (String(centre.id) === currentVal) option.selected = true;
        centreSelect.appendChild(option);
      });
    }

    centreSelect.addEventListener('change', () => {
      const selectedCentre = centres.find((centre) => String(centre.id) === centreSelect.value);
      locationCard.hidden = !selectedCentre;
      centreLocation.textContent = selectedCentre ? selectedCentre.location : '';
    });

    function formatDate(date) {
      if (!date) return '—';
      const lang = AgriQI18n.getLanguage();
      const locale = lang === 'hi' ? 'hi-IN' : (lang === 'mr' ? 'mr-IN' : 'en-IN');
      return new Date(`${date}T00:00:00`).toLocaleDateString(locale, { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function bookingItem(booking) {
      const item = document.createElement('article');
      item.className = 'booking-item';
      const centre = centres.find((entry) => entry.id === booking.centreId);
      const title = document.createElement('strong');
      title.textContent = centre ? centre.name : `Centre #${booking.centreId}`;
      const details = document.createElement('p');
      const queueStatus = booking.queueStatus || 'WAITING';
      const tokenNumber = booking.tokenNumber || '-';
      const tokenPrefix = AgriQI18n.t('booking_token_prefix');
      details.textContent = `${tokenPrefix} ${tokenNumber} · ${formatDate(booking.bookingDate)} · ${booking.timeSlot}`;
      const status = document.createElement('span');
      status.className = `status status-${queueStatus.toLowerCase()}`;
      status.textContent = AgriQI18n.t('status_' + queueStatus.toLowerCase()) || queueStatus;
      item.append(title, details, status);
      return item;
    }

    function renderBookings(bookings) {
      cachedBookings = bookings || [];
      bookingsList.innerHTML = '';
      if (!cachedBookings.length) {
        bookingsList.innerHTML = `<p class="empty-state">${AgriQI18n.t('booking_empty')}</p>`;
        return;
      }
      cachedBookings.forEach((booking) => bookingsList.appendChild(bookingItem(booking)));
    }

    async function loadBookings() {
      if (!farmerId) return;
      bookingsList.innerHTML = `<p class="empty-state">${AgriQI18n.t('booking_loading')}</p>`;
      try {
        const response = await fetch(`/api/bookings/farmer/${farmerId}`);
        if (!response.ok) throw new Error();
        const bookings = await response.json();
        renderBookings(bookings);
      } catch (error) {
        bookingsList.innerHTML = `<p class="empty-state error-state">${AgriQI18n.t('booking_load_error')}</p>`;
      }
    }

    document.getElementById('bookingForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      formMessage.textContent = '';
      document.getElementById('successMessage').hidden = true;
      const booking = {
        farmerId,
        centreId: Number(centreSelect.value),
        bookingDate: document.getElementById('bookingDate').value,
        timeSlot: document.getElementById('timeSlot').value
      };
      try {
        const response = await fetch('/api/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(booking)
        });
        if (!response.ok) throw new Error();
        const savedBooking = await response.json();
        const datePrefix = AgriQI18n.t('booking_date_prefix');
        const tokenPrefix = AgriQI18n.t('booking_token_prefix');
        const statusPrefix = AgriQI18n.t('booking_status_prefix');
        const localizedStatus = AgriQI18n.t('status_' + (savedBooking.queueStatus || '').toLowerCase()) || savedBooking.queueStatus;
        document.getElementById('successDetails').textContent = `${datePrefix} ${formatDate(savedBooking.bookingDate)} · ${savedBooking.timeSlot}`;
        document.getElementById('successToken').textContent = `${tokenPrefix} ${savedBooking.tokenNumber}`;
        document.getElementById('successQueueStatus').textContent = `${statusPrefix} ${localizedStatus}`;
        document.getElementById('successMessage').hidden = false;
        document.getElementById('bookingForm').reset();
        locationCard.hidden = true;
        await loadBookings();
      } catch (error) {
        formMessage.textContent = AgriQI18n.t('booking_error');
      }
    });

    document.getElementById('refreshBookings').addEventListener('click', loadBookings);
    loadCentres().then(loadBookings);

    // Re-render bookings and centre labels on language switch
    window.addEventListener('agriq-lang-change', () => {
      renderCentreOptions();
      if (cachedBookings.length) {
        renderBookings(cachedBookings);
      }
    });
  </script>
</body>
</html>
