<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQ | Admin Login</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">A</span><span>AgriQ</span></a>
  </header>
  <main class="auth-card">
    <p class="eyebrow">Secure administration</p>
    <h1>Admin Login</h1>
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary">Sign in to admin</button>
    </form>
    <p id="message" class="message" role="alert"></p>
    <div class="auth-links">
      <p class="link"><a href="index.html">Farmer login</a></p>
    </div>
  </main>
  <script>
    if (sessionStorage.getItem('admin') === 'true') location.replace('admin-dashboard.html');
    document.getElementById('adminLoginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const message = document.getElementById('message');
      message.textContent = '';
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username.value.trim(), password: password.value })
        });
        if (!response.ok) throw new Error();
        sessionStorage.removeItem('farmer');
        sessionStorage.setItem('admin', 'true');
        location.href = 'admin-dashboard.html';
      } catch {
        message.textContent = 'Invalid admin credentials.';
      }
    });
  </script>
</body>
</html>
