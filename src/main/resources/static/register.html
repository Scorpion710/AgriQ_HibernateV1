<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriQ | Farmer Registration</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <header class="site-header" style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px;">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">A</span><span>AgriQ</span></a>
    <div style="display: flex; align-items: center; gap: 10px;">
      <select class="lang-select" aria-label="Select Language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
      </select>
      <button type="button" class="theme-toggle" aria-label="Toggle theme" data-i18n="theme_dark">Dark mode</button>
    </div>
  </header>
  <main class="auth-card">
    <p class="eyebrow" data-i18n="farmer_services_portal">Farmer services portal</p>
    <h1 data-i18n="reg_title">Farmer Registration</h1>
    <form id="register-form">
      <div class="form-group">
        <label for="name" data-i18n="reg_name_label">Farmer Name</label>
        <input id="name" data-i18n-placeholder="reg_name_placeholder" placeholder="Enter your full name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="aadhaarNumber" data-i18n="reg_aadhaar_label">Aadhaar Number</label>
        <input id="aadhaarNumber" type="text" inputmode="numeric" pattern="[0-9]{12}" maxlength="12" data-i18n-placeholder="reg_aadhaar_placeholder" placeholder="Enter 12-digit Aadhaar number" required autocomplete="off">
      </div>
      <div class="form-group">
        <label for="mobileNumber" data-i18n="reg_mobile_label">Mobile Number</label>
        <input id="mobileNumber" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" data-i18n-placeholder="reg_mobile_placeholder" placeholder="Enter 10-digit mobile number" required autocomplete="tel">
      </div>
      <div class="form-group">
        <label for="pin" data-i18n="login_pin_label">4-digit PIN</label>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="••••" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" data-i18n="reg_btn">Register</button>
    </form>
    <p id="message" class="message" role="alert"></p>
    <div class="auth-links">
      <p class="link"><a href="index.html" data-i18n="reg_back_login">Back to Login</a></p>
    </div>
  </main>
  <script>
    const form = document.getElementById('register-form');
    const message = document.getElementById('message');
    const aadhaarInput = document.getElementById('aadhaarNumber');
    const mobileInput = document.getElementById('mobileNumber');
    const pinInput = document.getElementById('pin');

    aadhaarInput.addEventListener('input', () => {
      aadhaarInput.value = aadhaarInput.value.replace(/\D/g, '').slice(0, 12);
    });

    mobileInput.addEventListener('input', () => {
      mobileInput.value = mobileInput.value.replace(/\D/g, '').slice(0, 10);
    });

    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      message.className = 'message';

      const name = form.name.value.trim();
      const aadhaarNumber = aadhaarInput.value.trim();
      const mobileNumber = mobileInput.value.trim();
      const pin = pinInput.value.trim();

      if (!/^[0-9]{12}$/.test(aadhaarNumber)) {
        message.textContent = AgriQI18n.t('reg_aadhaar_invalid');
        return;
      }
      if (!/^[0-9]{10}$/.test(mobileNumber)) {
        message.textContent = AgriQI18n.t('reg_mobile_invalid');
        return;
      }
      if (!/^[0-9]{4}$/.test(pin)) {
        message.textContent = AgriQI18n.t('reg_pin_invalid');
        return;
      }

      try {
        const response = await fetch('/api/farmers/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, aadhaarNumber, mobileNumber, pin })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          message.textContent = data.message || AgriQI18n.t('reg_failed');
          return;
        }
        message.textContent = AgriQI18n.t('reg_success');
        message.classList.add('success');
        setTimeout(() => { window.location.href = 'index.html'; }, 1200);
      } catch (error) {
        message.textContent = AgriQI18n.t('reg_network_error');
      }
    });
  </script>
</body>
</html>
